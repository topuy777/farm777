<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REMBO777 Ayam Laga</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
      font-family: Arial, sans-serif;
    }

    .gambar-rembo {
      width: 1000px;
      height: 600px;
      min-width: 1000px;
      max-width: 1000px;
      min-height: 600px;
      max-height: 600px;
      object-fit: cover;
      display: block;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);

      /* agar gambar tidak bisa diseleksi/ditarik */
      user-select: none;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <img 
    src="./rembo.jpg" 
    alt="REMBO777 Ayam Laga" 
    class="gambar-rembo"
    draggable="false"
  >

</body>
</html>
